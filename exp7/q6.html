<!DOCTYPE html>
<html>
<head>

    <title>Employee Management Dashboard</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            background-color: #222;
            color: white;
            padding: 15px;
        }

        .form {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #333;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #aaa;
            padding: 10px;
            text-align: center;
        }

        .selected {
            background-color: yellow;
        }

        .panel {
            background-color: white;
            padding: 15px;
            margin-top: 20px;
        }

        #status {
            font-weight: bold;
            color: green;
        }

    </style>

    <script>

        $(document).ready(function() {

            // jQuery GET
            $("table").on("click", ".selectBtn", function() {

                let row = $(this).closest("tr");

                let id = row.find(".empId").text();
                let name = row.find(".empName").text();
                let dept = row.find(".empDept").text();

                $("#empId").val(id);
                $("#empName").val(name);
                $("#department").val(dept);

                $(".selected").removeClass("selected");
                row.addClass("selected");

                $("#status").text("Selected employee details loaded.");

            });


            // jQuery SET / UPDATE
            $("#update").click(function() {

                let id = $("#empId").val();
                let name = $("#empName").val();
                let dept = $("#department").val();

                if (id == "" || name == "" || dept == "") {
                    alert("Please enter all employee details.");
                    return;
                }

                let row = $(".selected");

                if (row.length == 0) {
                    alert("Please select an employee to update.");
                    return;
                }

                row.find(".empId").text(id);
                row.find(".empName").text(name);
                row.find(".empDept").text(dept);

                $("#status").text("Employee updated successfully.");

            });


            // jQuery ADD
            $("#add").click(function() {

                let id = $("#empId").val();
                let name = $("#empName").val();
                let dept = $("#department").val();

                if (id == "" || name == "" || dept == "") {
                    alert("Please enter all employee details.");
                    return;
                }

                let newRow =
                    "<tr>" +
                    "<td class='empId'>" + id + "</td>" +
                    "<td class='empName'>" + name + "</td>" +
                    "<td class='empDept'>" + dept + "</td>" +
                    "<td><button class='selectBtn'>Select</button></td>" +
                    "</tr>";

                $("#employeeTable tbody").append(newRow);

                $("#status").text("Employee added successfully.");

            });


            // jQuery REMOVE
            $("#remove").click(function() {

                let row = $(".selected");

                if (row.length == 0) {
                    alert("Please select an employee to remove.");
                    return;
                }

                row.remove();

                $("#status").text("Employee removed successfully.");

            });


            // jQuery CSS Classes
            $("#highlight").click(function() {

                let row = $(".selected");

                if (row.length == 0) {
                    alert("Please select an employee.");
                    return;
                }

                row.toggleClass("selected");

            });


            // jQuery css()
            $("#changeColor").click(function() {

                $(".panel").css({
                    "background-color": "#e8f4ff",
                    "border": "2px solid blue"
                });

                $("#status").text("Information panel style changed.");

            });


            // jQuery Dimensions
            $("#dimensions").click(function() {

                let width = $("#employeeTable").width();
                let height = $("#employeeTable").height();

                $("#dimension").text(
                    "Table Width: " + width +
                    " px | Table Height: " + height + " px"
                );

            });


            // Clear form
            $("#clear").click(function() {

                $("#empId").val("");
                $("#empName").val("");
                $("#department").val("");

                $(".selected").removeClass("selected");

                $("#status").text("");

            });

        });

    </script>

</head>

<body>

    <h1>Employee Management Dashboard</h1>

    <div class="form">

        <h2>Employee Details</h2>

        Employee ID:
        <input type="text" id="empId">

        Employee Name:
        <input type="text" id="empName">

        Department:
        <input type="text" id="department">

        <br><br>

        <button id="add">Add Employee</button>

        <button id="update">Update Employee</button>

        <button id="remove">Remove Employee</button>

        <button id="highlight">Highlight</button>

        <button id="changeColor">Change Panel Style</button>

        <button id="dimensions">Show Table Dimensions</button>

        <button id="clear">Clear</button>

    </div>


    <table id="employeeTable">

        <thead>

            <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Department</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td class="empId">101</td>
                <td class="empName">Riya</td>
                <td class="empDept">HR</td>
                <td>
                    <button class="selectBtn">Select</button>
                </td>
            </tr>

            <tr>
                <td class="empId">102</td>
                <td class="empName">Arjun</td>
                <td class="empDept">IT</td>
                <td>
                    <button class="selectBtn">Select</button>
                </td>
            </tr>

            <tr>
                <td class="empId">103</td>
                <td class="empName">Meera</td>
                <td class="empDept">Finance</td>
                <td>
                    <button class="selectBtn">Select</button>
                </td>
            </tr>

        </tbody>

    </table>


    <div class="panel">

        <h3>Status</h3>

        <p id="status"></p>

        <p id="dimension"></p>

    </div>

</body>
</html>
