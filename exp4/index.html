    <main>
        <section class="menu-section">

            <div class="menu">

                <div class="menu-row">
                    <span class="itemName">Item 1</span>

            <div class="form-box">

                <h2>Sign In</h2>

                <form>

                    <label>Username</label>

                    <input type="text"
                           placeholder="Enter Username"
                           required>

                    <label>Password</label>

                    <input type="password"
                           placeholder="Enter Password"
                           required>

                    <button type="submit">
                        Sign In
                    </button>

                </form>
            </div>
            <div class="form-box">

                <h2>Sign Up</h2>

                <form>

                    <label>Name</label>

                    <input type="text"
                           placeholder="Enter Name"
                           required>

                    <label>Email</label>

                    <input type="email"
                           placeholder="Enter Email"
                           required>

                    <label>Password</label>
                    <input type="password"
                           placeholder="Enter Password"
                           required>

                    <button type="submit">
                        Sign Up
                    </button>

                </form>
            </div>
        </section>
