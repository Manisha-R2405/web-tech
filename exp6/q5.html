<!DOCTYPE html>
<html>
<head>
    <title>Student Array of Objects</title>
</head>
<body>
    <h1>Student Details</h1>
    <div id="output"></div>
    <script>
        let students = [
            {
                name: "Sowmi",
                regNo: "URK24CS1126",
                dob: "26-May-2006"
            },
            {
                name: "Vishal",
                regNo: "URK24CS1128",
                dob: "06-Jul-2006"
            },
            {
                name: "Manisha",
                regNo: "URK24CS1127",
                dob: "24-May-2007"
            }
        ];
        let output = "";
        for (let i = 0; i < students.length; i++) {
            let year = parseInt(
                students[i].dob.split("-")[2]
            );
            output += "<h3>" + students[i].name + "</h3>";

            output += "Register Number: " +
                students[i].regNo + "<br>";

            output += "Date of Birth: " +
                students[i].dob + "<br>";
            if (year < 2000) {

                output +=
                    "Category: Born before 2000";

            }
            else {

                output +=
                    "Category: Born after 2000";
            }

            output += "<hr>";
        }
        document.getElementById("output").innerHTML =
            output;

    </script>
</body>
</html>
