<!DOCTYPE html>
<html>
<head>
    <title>Coin Flip</title>

    <style>
        #coin {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Heads or Tails?</h1>

    <div>
        <img src="head.png" id="coin">
        <br><br>

        <button id="flip">Flip!</button>
    </div>

    <p>
        Heads Total: <span id="num_heads">0</span>
        <br>
        Tails Total: <span id="num_tails">0</span>
    </p>

    <script>
        let heads = 0;
        let tails = 0;
        document.getElementById("flip").addEventListener(
            "click",
            flipFunction
        );

        function flipFunction() {
            let result = Math.floor(Math.random() * 2);
            if (result === 0) {

                document.getElementById("coin").src = "head.png";

                heads++;

                document.getElementById("num_heads").innerHTML =
                    heads;
            }
            else {

                document.getElementById("coin").src = "tail.png";

                tails++;

                document.getElementById("num_tails").innerHTML =
                    tails;
            }

        }

    </script>
</body>
</html>
